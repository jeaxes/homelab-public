services:
  homepage:
    image: ghcr.io/gethomepage/homepage@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f  # pinned 2026-09-30, version v2.4.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "127.0.0.1:3000,localhost:3000"
      PUID: 1000
      PGID: 1000
    volumes:
      - ./config:/app/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - dockerproxy
    networks:
      - homelab
      - socket

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459  # pinned 2026-09-30, version v0.5.0
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - socket

networks:
  homelab:
    external: true
  socket:
    internal: true
