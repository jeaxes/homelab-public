- Verwaltung:
    - Portainer:
        icon: portainer.png
        href: https://127.0.0.1:9443
        description: Container-Verwaltung
        server: homeserver
        container: portainer
        siteMonitor: http://portainer:9000
        widget:
          type: portainer
          url: http://portainer:9000
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

- Infrastruktur:
    - Homepage:
        icon: homepage.png
        description: Dieses Dashboard
        server: homeserver
        container: homepage
    - Docker Socket Proxy:
        icon: docker.png
        description: Nur-Lese-Zugriff auf Docker
        server: homeserver
        container: dockerproxy

- Metriken:
    - Grafana:
        icon: grafana.png
        href: http://127.0.0.1:3002
        description: Dashboards & Verläufe
        server: homeserver
        container: grafana
        siteMonitor: http://grafana:3000/api/health
    - Prometheus:
        icon: prometheus.png
        href: http://127.0.0.1:9090
        description: Metrik-Datenbank
        server: homeserver
        container: prometheus
        widget:
          type: prometheus
          url: http://prometheus:9090

- Automatisierung:
    - n8n:
        icon: n8n.png
        href: http://127.0.0.1:5678
        description: Workflows & Automatisierung
        server: homeserver
        container: n8n
        siteMonitor: http://n8n:5678/healthz
    - n8n-Datenbank:
        icon: postgres.png
        description: PostgreSQL (nur intern)
        server: homeserver
        container: n8n-db

- Plattform:
    - Traefik:
        icon: traefik.png
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse Proxy & HTTPS
        server: homeserver
        container: traefik
    - Gitea:
        icon: gitea.png
        href: https://gitea.{{HOMEPAGE_VAR_DOMAIN}}
        description: Eigene Git-Plattform
        server: homeserver
        container: gitea
    - IT-Tools:
        icon: it-tools.png
        href: https://tools.{{HOMEPAGE_VAR_DOMAIN}}
        description: Admin-Werkzeugkasten
        server: homeserver
        container: it-tools

