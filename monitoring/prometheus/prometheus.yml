global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["172.30.0.1:9100"]
        labels:
          instance: homeserver
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: homeserver
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]


  - job_name: zertifikate-extern
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [https_extern]
    # Targets live in targets/extern.yml (not in Git), see targets/extern.yml.example
    file_sd_configs:
      - files: [/etc/prometheus/targets/extern.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: zertifikate-intern
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [https_intern]
    # Targets live in targets/intern.yml (not in Git), see targets/intern.yml.example
    file_sd_configs:
      - files: [/etc/prometheus/targets/intern.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
