name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse shell scripts
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: No implicit SSH trust
        run: bash tests/vm-setup-key-import.sh
      - name: Reject unsafe backup directories
        run: bash tests/backup-directory-boundary.sh
